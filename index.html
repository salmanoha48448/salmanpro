<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALMAN</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="bg-animation"></div>

<div class="cursor-glow"></div>

<div class="particles"></div>

<div class="container">

<h1 class="title">
SALMAN
</h1>

<div class="buttons">

<button class="btn" onclick="defaultMode()">
PRESS
</button>

<button class="btn" onclick="animeMode()">
PRESS
</button>

<button class="btn" onclick="skullMode()">
PRESS
</button>

<button class="btn" onclick="iranMode()">
PRESS
</button>

</div>

<a class="telegram" href="https://t.me/irsalman" target="_blank">
@irsalman
</a>

</div>

<div class="overlay-text" id="overlayText"></div>

<script>

/* PARTICLES */

const particles = document.querySelector('.particles');

for(let i=0;i<180;i++){

let p=document.createElement('span');

p.classList.add('particle');

p.style.left=Math.random()*100+'vw';

p.style.animationDuration=
(Math.random()*5+4)+'s';

p.style.animationDelay=
Math.random()*5+'s';

particles.appendChild(p);
}

/* CURSOR GLOW */

const glow=document.querySelector('.cursor-glow');

document.addEventListener('mousemove',(e)=>{

glow.style.left=e.clientX+'px';

glow.style.top=e.clientY+'px';

});

/* OVERLAY */

const overlay=document.getElementById('overlayText');

/* RESET */

function clearModes(){

document.body.className='';

overlay.classList.remove('show');

}

/* DEFAULT */

function defaultMode(){

clearModes();

overlay.innerHTML='SALMAN';

overlay.style.color='#00f7ff';

setTimeout(()=>{
overlay.classList.add('show');
},100);

}

/* ANIME */

function animeMode(){

clearModes();

document.body.classList.add('anime');

overlay.innerHTML='🏴‍☠️ SALMAN';

overlay.style.color='gold';

setTimeout(()=>{
overlay.classList.add('show');
},100);

}

/* SKULL */

function skullMode(){

clearModes();

document.body.classList.add('skull');

overlay.innerHTML='☠️ SALMAN ☠️';

overlay.style.color='white';

setTimeout(()=>{
overlay.classList.add('show');
},100);

}

/* IRAN */

function iranMode(){

clearModes();

document.body.classList.add('iran');

overlay.innerHTML='وطنم';

overlay.style.color='white';

setTimeout(()=>{
overlay.classList.add('show');
},100);

}

defaultMode();

</script>

</body>
</html>
