<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salman</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
background:#050816;
font-family:'Orbitron',sans-serif;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* Background Glow */

.bg{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#00f7ff22,transparent 40%),
radial-gradient(circle at bottom right,#ff00ff22,transparent 40%);
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{
transform:scale(1) rotate(0deg);
}
100%{
transform:scale(1.2) rotate(5deg);
}
}

/* Floating Balls */

.ball{
position:absolute;
border-radius:50%;
filter:blur(10px);
opacity:.5;
animation:float 10s infinite ease-in-out;
}

.ball:nth-child(1){
width:200px;
height:200px;
background:#00f7ff;
top:10%;
left:10%;
}

.ball:nth-child(2){
width:250px;
height:250px;
background:#ff00ff;
bottom:10%;
right:10%;
animation-delay:2s;
}

.ball:nth-child(3){
width:120px;
height:120px;
background:#00ff88;
bottom:20%;
left:20%;
animation-delay:4s;
}

@keyframes float{
0%{
transform:translateY(0px) translateX(0px);
}
50%{
transform:translateY(-40px) translateX(20px);
}
100%{
transform:translateY(0px) translateX(0px);
}
}

/* Main Card */

.container{
position:relative;
z-index:10;
text-align:center;
padding:50px;
border-radius:30px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:
0 0 40px rgba(0,255,255,0.2),
0 0 80px rgba(255,0,255,0.15);
animation:cardFloat 5s infinite ease-in-out;
}

@keyframes cardFloat{
0%{
transform:translateY(0px);
}
50%{
transform:translateY(-10px);
}
100%{
transform:translateY(0px);
}
}

/* Salman Text */

h1{
font-size:90px;
letter-spacing:12px;
color:white;
text-transform:uppercase;
position:relative;
animation:textGlow 2s infinite alternate;
}

h1::after{
content:"SALMAN";
position:absolute;
left:0;
top:0;
color:#00f7ff;
filter:blur(20px);
opacity:.7;
z-index:-1;
}

@keyframes textGlow{
0%{
text-shadow:
0 0 10px #00f7ff,
0 0 20px #00f7ff,
0 0 40px #00f7ff;
transform:scale(1);
}
100%{
text-shadow:
0 0 20px #ff00ff,
0 0 40px #ff00ff,
0 0 80px #ff00ff;
transform:scale(1.05);
}
}

/* Subtitle */

p{
margin-top:20px;
font-size:18px;
color:#ccc;
animation:fade 3s infinite;
}

@keyframes fade{
0%,100%{
opacity:.4;
}
50%{
opacity:1;
}
}

/* Button */

button{
margin-top:35px;
padding:15px 35px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#00f7ff,#ff00ff);
color:white;
font-size:18px;
cursor:pointer;
transition:.4s;
box-shadow:0 0 20px rgba(0,255,255,.4);
}

button:hover{
transform:scale(1.1) rotate(-2deg);
box-shadow:
0 0 20px #00f7ff,
0 0 40px #ff00ff;
}

/* Particles */

.particle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
opacity:.5;
animation:particles 8s linear infinite;
}

@keyframes particles{
0%{
transform:translateY(100vh) scale(0);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-10vh) scale(1.5);
opacity:0;
}
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="ball"></div>
<div class="ball"></div>
<div class="ball"></div>

<div class="container">
<h1>SALMAN</h1>
<p>WELCOME TO THE FUTURE</p>

<button onclick="playEffect()">
ENTER
</button>
</div>

<script>

/* Particles */

for(let i=0;i<80;i++){

let particle=document.createElement('div');
particle.classList.add('particle');

particle.style.left=Math.random()*100+'vw';
particle.style.animationDuration=(Math.random()*5+3)+'s';
particle.style.animationDelay=Math.random()*5+'s';

document.body.appendChild(particle);
}

/* Button Effect */

function playEffect(){

document.body.style.transition='1s';
document.body.style.transform='scale(1.05)';

setTimeout(()=>{
document.body.style.transform='scale(1)';
},800);

alert("🔥 Welcome Salman 🔥");
}

</script>

</body>
</html>
